[theme]
base = "dark"

primaryColor = "#FF7A1F"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#151517"
textColor = "#F2F2F3"
linkColor = "#FF9448"
borderColor = "#2A2A2E"
dataframeBorderColor = "#2A2A2E"
dataframeHeaderBackgroundColor = "#151517"
codeBackgroundColor = "#151517"

font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontWeights = [700, 700, 650, 600, 600, 600]

baseRadius = "0.4rem"
buttonRadius = "0.4rem"
showWidgetBorder = true

# Validated against the dark chart surface: orange/blue clear the lightness
# band, chroma floor, CVD separation and contrast checks.
chartCategoricalColors = ["#e8641f", "#3987e5", "#1baf7a", "#eda100", "#d55181"]
chartSequentialColors = [
  "#3a1a08", "#5c2a0c", "#7d3a10", "#9f4a14", "#c05a18",
  "#e8641f", "#ee8145", "#f39e6b", "#f8bb92", "#fcd8b8",
]

[server]
maxUploadSize = 25
